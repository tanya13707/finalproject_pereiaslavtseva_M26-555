[project]
name = "finalproject-pereiaslavtseva-m26-555"
version = "0.1.0"
description = "Консольная платформа для управления виртуальным валютным портфелем"
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]